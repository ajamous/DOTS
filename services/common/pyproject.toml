[project]
name = "dots-common"
version = "0.1.0"
description = "DOTS 2.0 shared primitives: JCS, signatures, RFC 9162 Merkle trees, models"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44",
  "rfc8785>=0.1.4",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dots_common"]
