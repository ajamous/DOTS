[project]
name = "dots-settlement"
version = "0.1.0"
description = "DOTS 2.0 settlement engine: netting, fraud gate, statements, payouts"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "dots-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "eth-account>=0.13",
]

[project.scripts]
dots-settlement = "dots_settlement.__main__:main"

[tool.uv.sources]
dots-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dots_settlement"]
