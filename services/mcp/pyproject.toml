[project]
name = "dots-mcp"
version = "0.1.0"
description = "DOTS 2.0 read-only MCP server for AI agents"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "dots-common",
  "mcp==2.3.0",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
]

[project.scripts]
dots-mcp = "dots_mcp.__main__:main"

[tool.uv.sources]
dots-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dots_mcp"]
