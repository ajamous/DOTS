[project]
name = "dots-lab"
version = "0.1.0"
description = "DOTS 2.0 lab: bootstrap (keys, certs, configs) and end-to-end checks"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["dots-common", "cryptography>=44", "eth-account>=0.13"]

[project.scripts]
dots-lab-bootstrap = "dots_lab.bootstrap:main"

[tool.uv.sources]
dots-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dots_lab"]
