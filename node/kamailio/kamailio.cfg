#!KAMAILIO
#
# DOTS 2.0 node: Kamailio 6.0 / 6.1 routing script.
#
#  - Customer side (UDP 5060, access network): calls originated by this
#    operator's customers. Attestation A, Identity header signed (secsipid).
#  - Federation side (TLS 5061, mutual TLS): calls from peer nodes. The
#    peer's node id is the CN of its verified client certificate. Identity
#    header verified against the lab STI-CA.
#  - Registrar for the operator's PBX/trunks; contacts replicated inside the
#    operator's own cluster with dmq + dmq_usrloc (never to other operators).
#  - Every dialog end (or failure) is posted to the local receipt service
#    with http_async_client (ARCHITECTURE.md §8.3).
#
# Instance values (addresses, DMQ peer, tokens) come from instance.cfg,
# written by the entrypoint. Node values and the routing tables generated
# from the peer registry come from node.cfg, written by the lab bootstrap.

#!include_file "/etc/kamailio/instance.cfg"

# rtpengine flags for every offer and answer (ARCHITECTURE.md §8.2).
# With SDES-SRTP on both legs rtpengine copies the endpoints' a=crypto
# parameters (keys included) to the other leg and relays the packets without
# decrypting them, while still anchoring the media and counting packets.
# DTLS=off stops it re-offering SDES as DTLS-SRTP (which it would terminate),
# SDES-nonew stops it adding suites with keys of its own, ICE=remove keeps
# the media on rtpengine. Plain RTP calls are unaffected.
#!substdef "!RTPE_FLAGS!replace-origin replace-session-connection DTLS=off SDES-nonew ICE=remove!g"

####### Global parameters #########

debug=2
log_stderror=yes
log_prefix="{$mt $hdr(CSeq) $ci} "
fork=yes
children=4
tcp_children=4
enable_tls=yes
auto_aliases=no
tcp_accept_no_cl=yes
# async framework for the durable call-end spool (sql_query_async)
async_workers=2
tcp_connection_lifetime=3605
dns_try_ipv6=no
use_dns_cache=on
server_header="Server: DOTS node"
user_agent_header="User-Agent: DOTS node"

####### Modules #########

# tls.so must be loaded first
loadmodule "tls.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "cfgutils.so"
loadmodule "ipops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "dialog.so"
loadmodule "jansson.so"
loadmodule "http_async_client.so"
loadmodule "dmq.so"
loadmodule "dmq_usrloc.so"
loadmodule "secsipid.so"
loadmodule "rtpengine.so"
loadmodule "xhttp.so"
loadmodule "db_postgres.so"
loadmodule "sqlops.so"

modparam("tm", "fr_timer", 10000)
modparam("tm", "fr_inv_timer", 60000)
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("tls", "config", "/etc/kamailio/tls.cfg")

modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)

modparam("dialog", "default_timeout", 7200)
modparam("dialog", "enable_stats", 0)

# DMQ bus: this operator's own instances only, over mutual TLS.
modparam("dmq", "server_address", "DOTS_DMQ_SELF")
modparam("dmq", "notification_address", "DOTS_DMQ_NOTIFY")
modparam("dmq", "multi_notify", 0)
modparam("dmq", "num_workers", 2)
modparam("dmq", "ping_interval", 15)
modparam("dmq_usrloc", "enable", 1)
modparam("dmq_usrloc", "sync", 1)
modparam("dmq_usrloc", "replicate_socket_info", 0)

# STIR/SHAKEN: verify time validity (1) and chain to the custom root (4).
modparam("secsipid", "expire", 300)
modparam("secsipid", "timeout", 3)
modparam("secsipid", "libopt", "CertVerify=5")
modparam("secsipid", "libopt", "CertCAFile=/state/stir/ca.pem")
modparam("secsipid", "cache_dir", "/tmp/secsipid")

modparam("rtpengine", "rtpengine_sock", "DOTS_RTPENGINE_SOCK")

modparam("http_async_client", "workers", 2)
modparam("http_async_client", "connection_timeout", 2000)

modparam("xhttp", "url_match", "^/stir/")

# Durable call-end spool (ARCHITECTURE.md §8.3): every event is also inserted
# into call_end_spool in this operator's own database; the receipt service
# reconciles from it, so an event lost while the receipt service is down is
# recovered. The role used here may only INSERT into that table.
modparam("sqlops", "sqlcon", "spool=>DOTS_SPOOL_DB_URL")

####### Routing logic ########

# Node defines and generated routes (DOTS_RANGES, DOTS_PEER).
#!include_file "/etc/kamailio/node.cfg"

request_route {
	route(REQINIT);

	if (is_method("KDMQ")) {
		route(DMQ);
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	route(WITHINDLG);

	if (is_method("REGISTER")) {
		route(REGISTRAR);
		exit;
	}

	if (!is_method("INVITE")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	route(CLASSIFY);
	remove_hf("Route");
	# record_route() is added in RELAY, after rtpengine: msg_apply_changes()
	# (route RTPE) refuses to run once a Record-Route has been added
	if ($var(dir) == "out") {
		route(ORIGINATE);
	} else {
		route(TERMINATE);
	}
}

route[REQINIT] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "malformed SIP message from $si:$sp\n");
		exit;
	}
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "Keepalive");
		exit;
	}
}

route[DMQ] {
	# KDMQ only from our own cluster: TLS with a verified certificate whose
	# CN is our node id (all instances of one operator share that identity).
	if ($proto != "tls" || !is_peer_verified() || $tls_peer_subject_cn != "DOTS_NODE_ID") {
		xlog("L_WARN", "rejecting KDMQ from $si (cn=$tls_peer_subject_cn)\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
	dmq_handle_message();
}

route[WITHINDLG] {
	if (!has_totag()) {
		return;
	}
	if (loose_route()) {
		if (is_method("BYE")) {
			rtpengine_manage();
		} else if (is_method("ACK|INVITE|UPDATE|PRACK") && has_body("application/sdp")) {
			rtpengine_manage("RTPE_FLAGS");
		}
		route(RELAY);
		exit;
	}
	if (is_method("ACK")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}
	sl_send_reply("404", "Not here");
	exit;
}

route[REGISTRAR] {
	if (!is_in_subnet("$si", "DOTS_ACCESS_NET")) {
		sl_send_reply("403", "Registration only from the access network");
		exit;
	}
	if (!save("location")) {
		sl_reply_error();
	}
}

# Sets $var(dir) = out (our customer) or in (a federation peer), $var(peer).
route[CLASSIFY] {
	if ($proto == "tls" && $Rp == 5061) {
		if (!is_peer_verified()) {
			sl_send_reply("403", "Peer certificate required");
			exit;
		}
		$var(peer) = $tls_peer_subject_cn;
		route(DOTS_PEER);
		if ($var(peer_ok) != 1) {
			xlog("L_WARN", "INVITE from unknown peer cn=$var(peer)\n");
			sl_send_reply("403", "Unknown peer");
			exit;
		}
		$var(dir) = "in";
		return;
	}
	if (is_in_subnet("$si", "DOTS_ACCESS_NET")) {
		$var(dir) = "out";
		return;
	}
	sl_send_reply("403", "Forbidden");
	exit;
}

route[NUMBERS] {
	$var(num) = $rU;
	if ($(var(num){s.substr,0,1}) == "+") {
		$var(num) = $(var(num){s.substr,1,0});
	}
	$var(src) = $fU;
	if ($(var(src){s.substr,0,1}) == "+") {
		$var(src) = $(var(src){s.substr,1,0});
	}
	if (!($var(num) =~ "^[1-9][0-9]{6,14}$")) {
		sl_send_reply("484", "Address Incomplete");
		exit;
	}
}

route[NOW_MS] {
	$var(tv) = $TV(Sn);
	$var(now_ms) = $(var(tv){s.select,0,.}) + $(var(tv){s.select,1,.}{s.substr,0,3});
}

route[DIALOG_VARS] {
	route(NOW_MS);
	dlg_manage();
	$dlg_var(dir) = $var(dir);
	$dlg_var(peer) = $var(peer);
	$dlg_var(src) = "+" + $var(src);
	$dlg_var(dst) = "+" + $var(num);
	$dlg_var(attest) = $var(attest);
	$dlg_var(idv) = $var(idv);
	$dlg_var(start_ms) = $var(now_ms);
	$dlg_var(code) = "";
	$dlg_var(tpeer) = "";
	$dlg_var(origid) = $var(origid);
}

route[ORIGINATE] {
	route(NUMBERS);
	route(DOTS_RANGES);
	if ($var(home) == "") {
		sl_send_reply("404", "No route to number range");
		exit;
	}
	if ($var(home) == "DOTS_NODE_ID") {
		# on-net call: no federation hop, no receipt
		route(LOCAL);
		exit;
	}
	# Transit routes (§5.8): some destinations are reached through another
	# operator, which bills us for the hop and settles onward itself.
	route(DOTS_VIA);
	$var(peer) = $var(home);
	if ($var(via) != "") {
		$var(peer) = $var(via);
	}
	route(DOTS_PEER);
	if ($var(peer_ok) != 1) {
		sl_send_reply("503", "Peer not configured");
		exit;
	}
	# Customer traffic from our own access network: full attestation.
	$var(attest) = "A";
	$var(idv) = "1";
	remove_hf("Identity");
	route(NEW_ORIGID);
	if (!secsipid_add_identity("$var(src)", "$var(num)", "A", "$var(origid)", "DOTS_STIR_X5U",
			"DOTS_STIR_KEY")) {
		xlog("L_ERR", "failed to add Identity header\n");
		sl_send_reply("500", "Identity signing failed");
		exit;
	}
	route(DIALOG_VARS);
	route(RTPE);
	$dlg_var(sdes_o) = $var(sdes_same);
	$du = $var(peer_uri);
	route(RELAY);
}

route[TERMINATE] {
	route(NUMBERS);
	route(DOTS_RANGES);
	if ($var(home) != "DOTS_NODE_ID") {
		route(TRANSIT);
		# a peer may only send us our own ranges, unless we carry its transit
		sl_send_reply("404", "Not our number range");
		exit;
	}
	route(IDENTITY_IN);
	route(DIALOG_VARS);
	route(RTPE);
	$dlg_var(sdes_o) = $var(sdes_same);
	route(LOCAL);
}

# Carry a peer's call to the number's home node (§5.8). Only for upstream
# peers we agreed to carry; never back to the peer it came from. The caller's
# Identity header is verified and passed on unchanged (we do not re-sign).
# Two call-end events follow: in from the upstream peer, out to the next.
route[TRANSIT] {
	route(DOTS_TRANSIT);
	if ($var(transit_ok) != 1 || $var(home) == "" || $var(home) == $var(peer)) {
		return;
	}
	$var(up) = $var(peer);
	$var(peer) = $var(home);
	route(DOTS_PEER);
	if ($var(peer_ok) != 1) {
		$var(peer) = $var(up);
		return;
	}
	$var(next_uri) = $var(peer_uri);
	$var(peer) = $var(up);
	route(IDENTITY_IN);
	route(DIALOG_VARS);
	$dlg_var(tpeer) = $var(home);
	route(RTPE);
	$dlg_var(sdes_o) = $var(sdes_same);
	$du = $var(next_uri);
	route(RELAY);
}

# A fresh PASSporT origid for a call we sign: $var(origid), UUID-formatted.
# We choose it (rather than let secsipid generate one) so we know it without
# reading back the header we are adding.
route[NEW_ORIGID] {
	$var(seed) = $ci + ";" + $ft + ";" + $TV(Sn) + ";" + $RANDOM;
	$var(h) = $(var(seed){s.md5});
	$var(origid) = $(var(h){s.substr,0,8}) + "-" + $(var(h){s.substr,8,4}) + "-4"
		+ $(var(h){s.substr,13,3}) + "-" + $(var(h){s.substr,16,4}) + "-"
		+ $(var(h){s.substr,20,12});
}

# PASSporT origid of the Identity header: $var(origid). It identifies the
# call across B2BUAs that rewrite Call-ID (§5.9). Read whether or not the
# signature verifies: it is a correlation hint, never a trust decision.
route[ORIGID] {
	$var(origid) = "";
	if (is_present_hf("Identity")) {
		$var(jwt) = $(hdr(Identity){s.select,0,;});
		$var(payload) = $(var(jwt){s.select,1,.}{s.decode.base64t});
		if (jansson_get("origid", "$var(payload)", "$var(o)")
				&& $var(o) =~ "^[0-9A-Za-z][0-9A-Za-z._:-]{0,127}$") {
			$var(origid) = $var(o);
		}
	}
}

# Verify an inbound Identity header: $var(attest), $var(idv), $var(origid).
route[IDENTITY_IN] {
	route(ORIGID);
	$var(attest) = "none";
	$var(idv) = "0";
	if (is_present_hf("Identity")) {
		if (secsipid_check_identity("")) {
			$var(jwt) = $(hdr(Identity){s.select,0,;});
			$var(payload) = $(var(jwt){s.select,1,.}{s.decode.base64t});
			if (jansson_get("attest", "$var(payload)", "$var(a)")
					&& $var(a) =~ "^[ABC]$") {
				$var(attest) = $var(a);
				$var(idv) = "1";
			}
		} else {
			xlog("L_WARN", "Identity verification failed for call from $var(peer)\n");
		}
	}
}

# Deliver to this operator's registered PBX/trunk (AOR "pbx"). The lookup
# works on any instance of the cluster thanks to dmq_usrloc.
route[LOCAL] {
	if (!lookup("location", "sip:pbx@DOTS_NODE_ID")) {
		sl_send_reply("480", "Temporarily Unavailable");
		exit;
	}
	route(RELAY);
}

# rtpengine on an offer or answer. sdes_same = 1 when the SDP carried an
# SDES key and rtpengine forwarded the same a=crypto line unchanged: this
# hop neither re-keys nor decrypts the media.
route[RTPE] {
	$var(kin) = $(rb{line.sw,a=crypto:});
	rtpengine_manage("RTPE_FLAGS");
	msg_apply_changes();
	$var(kout) = $(rb{line.sw,a=crypto:});
	$var(sdes_same) = 0;
	if ($var(kin) != "" && $var(kin) == $var(kout)) {
		$var(sdes_same) = 1;
	}
}

route[RELAY] {
	if (is_method("INVITE") && !has_totag()) {
		record_route();
	}
	if (is_method("INVITE")) {
		t_on_reply("REPLY");
		t_on_failure("FAIL");
	}
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

# Every reply, before transaction matching. A provisional reply that no
# longer matches a transaction arrived after the final reply (seen on
# Kamailio 6.1 for the first call over a fresh inter-node TLS connection:
# the 180 overtaken by the 200). tm would forward it statelessly, and a UA
# treats a 180 after the 200 as a protocol error, so it goes no further.
# Late 2xx replies still pass: ACK retransmission relies on them.
reply_route {
	if (status =~ "^1[0-9][0-9]$" && !t_check_trans()) {
		xlog("L_INFO", "dropping late $rs for $ci: its transaction is already completed\n");
		drop;
	}
}

onreply_route[REPLY] {
	if (has_body("application/sdp")) {
		route(RTPE);
		$dlg_var(sdes_a) = $var(sdes_same);
	}
	if (status =~ "^[3-6][0-9][0-9]$") {
		$dlg_var(code) = $rs;
	}
}

failure_route[FAIL] {
	if (t_is_canceled()) {
		exit;
	}
	rtpengine_manage();
}

# ---------------------------------------------------------------- call-end events

event_route[dialog:start] {
	route(NOW_MS);
	$dlg_var(answer_ms) = $var(now_ms);
}

event_route[dialog:end] {
	$var(status) = "answered";
	route(CALL_END);
}

event_route[dialog:failed] {
	$var(status) = "failed";
	route(CALL_END);
}

route[CALL_END] {
	route(NOW_MS);
	$var(ev) = "{}";
	jansson_set("string", "node_id", "DOTS_NODE_ID", "$var(ev)");
	jansson_set("string", "call_id", "$dlg(callid)", "$var(ev)");
	jansson_set("string", "from_tag", "$dlg(from_tag)", "$var(ev)");
	jansson_set("string", "direction", "$dlg_var(dir)", "$var(ev)");
	jansson_set("string", "peer_node", "$dlg_var(peer)", "$var(ev)");
	jansson_set("string", "status", "$var(status)", "$var(ev)");
	jansson_set("integer", "start_ts", "$dlg_var(start_ms)", "$var(ev)");
	if ($var(status) == "answered" && $dlg_var(answer_ms) != $null) {
		jansson_set("integer", "answer_ts", "$dlg_var(answer_ms)", "$var(ev)");
	}
	jansson_set("integer", "end_ts", "$var(now_ms)", "$var(ev)");
	if ($dlg_var(code) != $null && $dlg_var(code) != "") {
		jansson_set("integer", "sip_code", "$dlg_var(code)", "$var(ev)");
	}
	jansson_set("string", "src", "$dlg_var(src)", "$var(ev)");
	jansson_set("string", "dst", "$dlg_var(dst)", "$var(ev)");
	jansson_set("string", "attestation", "$dlg_var(attest)", "$var(ev)");
	if ($dlg_var(origid) != $null && $dlg_var(origid) != "") {
		jansson_set("string", "origid", "$dlg_var(origid)", "$var(ev)");
	}
	if ($dlg_var(idv) == "1") {
		jansson_set("true", "identity_verified", 0, "$var(ev)");
	} else {
		jansson_set("false", "identity_verified", 0, "$var(ev)");
	}
	if ($var(status) == "answered" && rtpengine_query_v("j", "$var(rtp)")) {
		route(MEDIA_STATS);
	}
	xlog("L_INFO", "call-end $var(status) dir=$dlg_var(dir) peer=$dlg_var(peer)\n");
	route(EMIT);
	if ($dlg_var(tpeer) != $null && $dlg_var(tpeer) != "") {
		# transit: the onward leg is our own outbound call to the next node
		jansson_set("string", "direction", "out", "$var(ev)");
		jansson_set("string", "peer_node", "$dlg_var(tpeer)", "$var(ev)");
		jansson_set("string", "upstream_peer", "$dlg_var(peer)", "$var(ev)");
		xlog("L_INFO", "call-end $var(status) dir=out peer=$dlg_var(tpeer) (transit)\n");
		route(EMIT);
	}
}

# Spool the event durably, then post it to the receipt service.
route[EMIT] {
	# Durable copy first. The JSON is base64-encoded so no quoting or escaping
	# of SIP-controlled values (Call-ID, tags) ever reaches the SQL text.
	$var(ev64) = $(var(ev){s.encode.base64});
	sql_query_async("spool", "INSERT INTO call_end_spool (payload) VALUES (convert_from(decode('$var(ev64)', 'base64'), 'UTF8')::jsonb)");
	$http_req(all) = $null;
	$http_req(suspend) = 0;
	$http_req(timeout) = 3000;
	$http_req(method) = "POST";
	$http_req(hdr) = "Content-Type: application/json";
	$http_req(hdr) = "Authorization: Bearer DOTS_INTERNAL_TOKEN";
	$http_req(body) = $var(ev);
	http_async_query("DOTS_RECEIPTS_URL/internal/call-end", "CALL_END_REPLY");
}

# Packets rtpengine forwarded for this call. "in" counts what the caller
# side sent, "out" what the callee side sent; zero on either is one-way.
# e2e: SRTP on both legs, and rtpengine forwarded both endpoints' SDES keys
# unchanged (route RTPE), so it relayed the packets without decrypting them.
route[MEDIA_STATS] {
	$var(pin) = 0;
	$var(pout) = 0;
	$var(fflags) = "";
	$var(tflags) = "";
	$var(fproto) = "";
	$var(tproto) = "";
	jansson_get("totals.RTP.packets", "$var(rtp)", "$var(ptot)");
	$var(ftag) = $dlg(from_tag);
	$var(ttag) = $dlg(to_tag);
	jansson_get_field("tags", "$var(rtp)", "$var(tags)");
	if (jansson_get_field("$var(ftag)", "$var(tags)", "$var(fleg)")) {
		jansson_get("medias[0].streams[0].stats.packets", "$var(fleg)", "$var(pin)");
		jansson_get("medias[0].flags", "$var(fleg)", "$var(fflags)");
		jansson_get("medias[0].protocol", "$var(fleg)", "$var(fproto)");
	}
	if (jansson_get_field("$var(ttag)", "$var(tags)", "$var(tleg)")) {
		jansson_get("medias[0].streams[0].stats.packets", "$var(tleg)", "$var(pout)");
		jansson_get("medias[0].flags", "$var(tleg)", "$var(tflags)");
		jansson_get("medias[0].protocol", "$var(tleg)", "$var(tproto)");
	}
	$var(media) = "{}";
	jansson_set("integer", "pkts_in", "$var(pin)", "$var(media)");
	jansson_set("integer", "pkts_out", "$var(pout)", "$var(media)");
	if ($dlg_var(sdes_o) == "1" && $dlg_var(sdes_a) == "1"
			&& $var(fproto) =~ "SAVP" && $var(tproto) =~ "SAVP") {
		jansson_set("true", "e2e", 0, "$var(media)");
	} else {
		jansson_set("false", "e2e", 0, "$var(media)");
	}
	xlog("L_INFO", "media caller=$var(fproto) $var(fflags) callee=$var(tproto) $var(tflags)\n");
	jansson_set("obj", "media", "$var(media)", "$var(ev)");
}

route[CALL_END_REPLY] {
	if (!$http_ok || $http_rs != 200) {
		xlog("L_ERR", "call-end event for $http_req_id not accepted: $http_rs $http_err $http_rb\n");
	}
}

# ---------------------------------------------------------------- STIR certificate

event_route[xhttp:request] {
	if ($hu == "/stir/cert.pem" && file_read("/state/DOTS_NODE_ID/stir/cert.pem", "$var(stir_cert)")) {
		xhttp_reply("200", "OK", "application/x-pem-file", "$var(stir_cert)");
		exit;
	}
	xhttp_reply("404", "Not Found", "text/plain", "not found");
}
