name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, type check, unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dots
          POSTGRES_PASSWORD: dots
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U dots" --health-interval 2s --health-timeout 2s
          --health-retries 30
    env:
      DOTS_TEST_PG_DSN: postgresql://dots:dots@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --frozen
      - run: uv run ruff check services lab
      - run: uv run ruff format --check services lab
      - run: uv run mypy services/common/src services/receipts/src services/settlement/src lab/src
      - run: uv run pytest -q

  lab:
    name: Lab end to end (3 operators, Kamailio + rtpengine + SIPp)
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --profile test build
      - name: Start lab
        run: docker compose up -d --wait
      - name: End-to-end scenarios
        run: python3 lab/run_e2e.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

